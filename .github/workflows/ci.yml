name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scaffold-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # `|| true` was previously swallowing a failed install (registry
      # outage, lockfile/engine drift): the job then ran build/test against
      # a missing or partial node_modules, so a red CI run got blamed on
      # whichever of those tripped over it first instead of on the real
      # root cause (docs/dream-cycle/2026-10-09-developer-experience-report.md).
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      # ruclip-metaharness (docs/design/RUCLIP-METAHARNESS.md §5): advisory
      # informational gate — no threshold to fail against yet (no baseline
      # history), so a bad score/genome/mcp-scan reading is surfaced in the
      # log but never fails the build.
      - name: metaharness build-time genome (advisory)
        run: npm run harness:advisory
        continue-on-error: true
      # Hard gate: cheap (~2s), catches .harness/bench.json tampering per
      # ADR-076's anti-gaming intent (taskHash mismatch -> exit 1).
      - name: metaharness bench suite integrity
        run: npm run harness:bench-verify
