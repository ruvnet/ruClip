name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scaffold-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund || true
      - run: npm run build
      - run: npm test
      # Dream Cycle 2026-10-29 (developer-experience): first real lint gate,
      # replacing the former `npm run lint` no-op stub. Advisory only for
      # now (continue-on-error) — the first run surfaced 7 real findings
      # (docs/dream-cycle/2026-10-29-developer-experience-report.md) that
      # predate this gate; promoting it to a hard failure is a separate,
      # future decision once a human has triaged that backlog.
      - name: lint (advisory)
        run: npm run lint
        continue-on-error: true
      # ruclip-metaharness (docs/design/RUCLIP-METAHARNESS.md §5): advisory
      # informational gate — no threshold to fail against yet (no baseline
      # history), so a bad score/genome/mcp-scan reading is surfaced in the
      # log but never fails the build.
      - name: metaharness build-time genome (advisory)
        run: npm run harness:advisory
        continue-on-error: true
      # Hard gate: cheap (~2s), catches .harness/bench.json tampering per
      # ADR-076's anti-gaming intent (taskHash mismatch -> exit 1).
      - name: metaharness bench suite integrity
        run: npm run harness:bench-verify
