name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scaffold-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund || true
      - run: npm run build
      # Real gate as of 2026-09-09 (was a no-op stub, never wired into CI —
      # docs/dream-cycle/2026-09-09-developer-experience-report.md): a
      # dedicated, non-emitting tsc config catching unused locals/params,
      # non-exhaustive switches, and implicit fallthrough returns.
      - run: npm run lint
      - run: npm test
      # ruclip-metaharness (docs/design/RUCLIP-METAHARNESS.md §5): advisory
      # informational gate — no threshold to fail against yet (no baseline
      # history), so a bad score/genome/mcp-scan reading is surfaced in the
      # log but never fails the build.
      - name: metaharness build-time genome (advisory)
        run: npm run harness:advisory
        continue-on-error: true
      # Hard gate: cheap (~2s), catches .harness/bench.json tampering per
      # ADR-076's anti-gaming intent (taskHash mismatch -> exit 1).
      - name: metaharness bench suite integrity
        run: npm run harness:bench-verify
