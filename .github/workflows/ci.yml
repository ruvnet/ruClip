name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scaffold-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund || true
      - run: npm run build
      - run: npm test
