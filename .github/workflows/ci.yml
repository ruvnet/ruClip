name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scaffold-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund || true
      - run: npm run build
      - run: npm test
      # ruclip-metaharness (docs/design/RUCLIP-METAHARNESS.md §5): advisory
      # informational gate — no threshold to fail against yet (no baseline
      # history), so a bad score/genome/mcp-scan reading is surfaced in the
      # log but never fails the build.
      - name: metaharness build-time genome (advisory)
        run: npm run harness:advisory
        continue-on-error: true
      # Hard gate: cheap (~2s), catches .harness/bench.json tampering per
      # ADR-076's anti-gaming intent (taskHash mismatch -> exit 1).
      - name: metaharness bench suite integrity
        run: npm run harness:bench-verify
      # Dream Cycle 2026-09-29 (developer-experience): advisory, informational
      # only — surfaces the dream/* branch backlog (18 unmerged as of
      # tonight, up from 9 on 2026-09-19) in every future PR's own CI log,
      # since it's otherwise only discoverable by manually cross-referencing
      # GitHub issues/PRs. Never a gate: an unrelated PR must never fail
      # over a backlog it didn't create.
      - name: dream-cycle branch backlog audit (advisory)
        run: npm run dream:branch-audit
        continue-on-error: true
